[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "John Pork", email = "hde-andr@student.42porto.com" }
]
requires-python = ">=3.12"
dependencies = [
    "flake8>=7.5.0",
    "llm-sdk",
    "mypy>=2.4.1",
    "numpy>=2.5.4",
    "pydantic>=2.14.2",
]

[project.scripts]
call-me-maybe = "call_me_maybe:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "llm_sdk",
]

[tool.uv.sources]
llm-sdk = { workspace = true, editable = true }
